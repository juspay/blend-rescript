name: Binding re-release (-N)

# On-demand, binding-only re-release of an OLD blend line that can't go through
# `main` (main always tracks the newest blend, so an older line can't be merged
# there without regressing it). Point this at the line's release BRANCH; it cuts
# the next `-N` suffix on top of that branch's version and publishes it —
# WITHOUT touching main.
#
#   base 0.0.37-beta.5  →  publishes 0.0.37-beta.5-1, then -2, then -3, …
#
# The `-N` is derived automatically from what's already on npm for that base, so
# re-runs never collide. Publishes with OIDC provenance under the chosen
# dist-tag (default `beta`), commits the version bump back to the branch, tags
# it, and mirrors to GitHub Packages — same guarantees as release.yml.
#
# Trigger: Actions tab → "Run workflow" (leave "Use workflow from" = main) →
# enter the source branch in `ref`.  Or:
#   gh workflow run binding-rerelease.yml -f ref=release/blend-0.0.37-beta.5-1
#
# NOTE: `ref` must be a BRANCH (the version bump is committed back to it), not a tag.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Source branch to re-release from (e.g. release/blend-0.0.37-beta.5-1)"
        required: true
        type: string
      dist_tag:
        description: "npm dist-tag to publish under (never 'latest' for a prerelease)"
        required: false
        default: "beta"
        type: string
      regenerate:
        description: "Regenerate bindings before publishing (else release exactly what is on the branch)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: rerelease-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  rerelease:
    name: Re-release ${{ inputs.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Node 24 ships npm >= 11.5.1, which OIDC trusted publishing requires.
      - name: Setup Node.js (npm registry)
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Optional — off by default. The branch is normally already prepped with the
      # bindings to ship; enable to force a fresh deterministic regen first.
      - name: Regenerate bindings
        if: ${{ inputs.regenerate }}
        run: npm run generate

      # Derive the next `-N`: strip any existing suffix to get the base version,
      # then pick max(published base-N) + 1. Starts at -1 when none exist.
      - name: Compute next -N version
        id: ver
        run: |
          NAME=$(node -p "require('./package.json').name")
          RAW=$(node -p "require('./package.json').version")
          BASE=$(echo "$RAW" | sed -E 's/-[0-9]+$//')
          EXISTING=$(npm view "$NAME" versions --json 2>/dev/null || echo "[]")
          NEXT=$(EXISTING="$EXISTING" BASE="$BASE" node -e '
            const raw = JSON.parse(process.env.EXISTING || "[]");
            const list = Array.isArray(raw) ? raw : [raw];
            const prefix = process.env.BASE + "-";
            let max = 0;
            for (const s of list) {
              if (typeof s === "string" && s.startsWith(prefix)) {
                const rest = s.slice(prefix.length);
                if (/^\d+$/.test(rest)) max = Math.max(max, parseInt(rest, 10));
              }
            }
            process.stdout.write(String(max + 1));
          ')
          NEWV="${BASE}-${NEXT}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "version=$NEWV" >> "$GITHUB_OUTPUT"
          echo "Re-release: base $BASE → $NEWV (dist-tag ${{ inputs.dist_tag }})"

      - name: Guard — never move 'latest' onto a prerelease
        run: |
          if [[ "${{ inputs.dist_tag }}" == "latest" && "${{ steps.ver.outputs.base }}" =~ -(beta|alpha|rc) ]]; then
            echo "Refusing to publish prerelease ${{ steps.ver.outputs.version }} under 'latest'."
            exit 1
          fi

      - name: Set version
        run: |
          node -e "const p=require('./package.json'); p.version='${{ steps.ver.outputs.version }}'; require('fs').writeFileSync('./package.json', JSON.stringify(p,null,2)+'\n');"
          npm install --package-lock-only

      - name: Build + format gate
        run: |
          npm run build
          npm run format:check

      - name: Guard — version not already published
        run: |
          if npm view "${{ steps.ver.outputs.name }}@${{ steps.ver.outputs.version }}" version >/dev/null 2>&1; then
            echo "${{ steps.ver.outputs.version }} already on npm — aborting."
            exit 1
          fi

      - name: Publish to npm (OIDC provenance)
        run: |
          echo "Publishing ${{ steps.ver.outputs.version }} under dist-tag '${{ inputs.dist_tag }}'..."
          npm publish --provenance --access public --tag "${{ inputs.dist_tag }}"

      # Record the re-release: commit the version bump back to the branch + tag.
      - name: Commit version bump + tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): binding-only re-release ${{ steps.ver.outputs.version }}"
          git push origin "HEAD:${{ inputs.ref }}"
          TAG="v${{ steps.ver.outputs.version }}"
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists — skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Setup Node for GitHub Packages
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@juspay"

      - name: Publish to GitHub Packages
        run: |
          NAME="${{ steps.ver.outputs.name }}"; VERSION="${{ steps.ver.outputs.version }}"
          if npm view "$NAME@$VERSION" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on GitHub Packages — skipping."
            exit 0
          fi
          npm publish --access public --no-git-checks --tag "${{ inputs.dist_tag }}" --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
