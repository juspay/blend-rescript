name: Try a bindgen build

# Regenerate the bindings with an ARBITRARY @juspay/rescript-bindgen build and surface the
# diff — without touching the pinned devDependency or the release path.
#
# The generator is the other half of this repo's output: `sync-bindings.yml` varies the BLEND
# version against a fixed bindgen, and this varies the BINDGEN version against a fixed blend.
# Together they cover both axes. Use it to review an unreleased bindgen (a PR's pkg.pr.new
# build, a beta dist-tag) before it is ever pinned here.
#
#   gh workflow run try-bindgen.yml \
#     -f bindgen_version=https://pkg.pr.new/@juspay/rescript-bindgen@168
#
# Deliberately SEPARATE from sync-bindings.yml rather than an extra input on it: that workflow
# carries release machinery (`--set-version`, lockfile refresh, beta dist-tag, a PR meant to be
# merged). Threading an unreleased bindgen through it would risk a preview build producing a
# publishable artifact. Nothing here writes package.json, the lockfile, or a dist-tag.

on:
  workflow_dispatch:
    inputs:
      bindgen_version:
        description: 'Bindgen spec: a version ("1.3.1"), a dist-tag ("next"), or a pkg.pr.new URL ("https://pkg.pr.new/@juspay/rescript-bindgen@168")'
        required: true
        type: string
      blend_version:
        description: 'Blend version to bind against. Leave empty to use the version pinned in package.json (isolates the bindgen change).'
        required: false
        default: ''
        type: string
      publish_preview:
        description: 'Also publish the regenerated package to pkg.pr.new, so a consumer can install this exact output.'
        required: false
        default: false
        type: boolean

concurrency:
  group: try-bindgen-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  try:
    name: Regenerate with a candidate bindgen
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # pkg.pr.new authenticates via OIDC when publish_preview is on
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Snapshot the baseline BEFORE regenerating: `npm run generate` passes --clean, which
      # wipes src/ (summary included), so the "before" numbers have to be copied out first.
      - name: Capture baseline
        id: baseline
        run: |
          cp src/_bindgen-summary.json "$RUNNER_TEMP/baseline-summary.json"
          BINDGEN=$(node -p "require('./node_modules/@juspay/rescript-bindgen/package.json').version")
          BLEND=$(node -p "require('./node_modules/@juspay/blend-design-system/package.json').version")
          echo "bindgen=$BINDGEN" >> $GITHUB_OUTPUT
          echo "blend=$BLEND" >> $GITHUB_OUTPUT
          echo "Baseline: bindgen $BINDGEN, blend $BLEND"

      # --no-save is the safety property of this whole workflow: package.json and the lockfile
      # are never modified, so a run structurally CANNOT become a real bindgen bump, and the
      # resulting diff is purely src/. A real bump stays a deliberate package.json PR.
      - name: Install candidate bindgen (--no-save)
        run: npm install --no-save "${{ inputs.bindgen_version }}"

      - name: Install candidate blend (--no-save)
        if: inputs.blend_version != ''
        run: npm install --no-save "@juspay/blend-design-system@${{ inputs.blend_version }}"

      # A pkg.pr.new build reports the SAME `version` string as the release it was branched
      # from — `@juspay/rescript-bindgen@1.3.0` in node_modules whether it is the published
      # 1.3.0 or a PR build on top of it. Version alone therefore cannot tell you what ran, so
      # record the resolved tarball plus a content hash. Without this a run can silently
      # regenerate with the wrong build and look entirely convincing.
      - name: Fingerprint what actually installed
        id: fingerprint
        run: |
          VERSION=$(node -p "require('./node_modules/@juspay/rescript-bindgen/package.json').version")
          RESOLVED=$(node -p "
            const l = require('./node_modules/.package-lock.json');
            const k = Object.keys(l.packages || {}).find((k) => k.endsWith('node_modules/@juspay/rescript-bindgen'));
            (k && l.packages[k].resolved) || '(registry default)';
          ")
          SHA=$(sha256sum node_modules/@juspay/rescript-bindgen/src/extract.mjs | cut -c1-16)
          BLEND=$(node -p "require('./node_modules/@juspay/blend-design-system/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "resolved=$RESOLVED" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "blend=$BLEND" >> $GITHUB_OUTPUT
          {
            echo "### Candidate build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| bindgen version string | \`$VERSION\` |"
            echo "| resolved from | \`$RESOLVED\` |"
            echo "| \`extract.mjs\` sha256 | \`$SHA…\` |"
            echo "| blend | \`$BLEND\` |"
          } >> $GITHUB_STEP_SUMMARY

      # continue-on-error on BOTH: a candidate that breaks generation or the compile is exactly
      # what this workflow exists to catch, and the diff is more useful than an early abort.
      # `scripts/generate.mjs` still writes src/ before its `broken > 0` gate exits non-zero.
      - name: Regenerate bindings
        id: generate
        continue-on-error: true
        run: npm run generate ${{ inputs.blend_version != '' && format('-- --blend {0}', inputs.blend_version) || '' }}

      - name: Build to check the output compiles
        id: build
        continue-on-error: true
        run: npm run build

      - name: Diff against the committed bindings
        id: diff
        run: |
          git add -A src
          if git diff --cached --quiet -- src; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Bindings are IDENTICAL to the committed baseline."
            echo "### ✅ No change — output is byte-identical to the committed bindings." >> $GITHUB_STEP_SUMMARY
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --cached --stat -- src | tee "$RUNNER_TEMP/diffstat.txt"
            {
              echo ""
              echo "### Diff vs committed bindings"
              echo ""
              echo '```'
              cat "$RUNNER_TEMP/diffstat.txt"
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
          fi
          # Unstage: create-pull-request stages its own paths, and a dirty index confuses it.
          git reset -q

      # Bucket movement is the signal that matters most — a diff that keeps every component
      # usable is very different from one that moves components into review/broken.
      - name: Compare report buckets
        id: buckets
        if: steps.diff.outputs.changed == 'true'
        run: |
          SUMMARY=$(node -e "
            const fs = require('fs');
            const read = (p) => { try { return JSON.parse(fs.readFileSync(p, 'utf8')).components || {}; } catch { return {}; } };
            const a = read(process.env.RUNNER_TEMP + '/baseline-summary.json');
            const b = read('src/_bindgen-summary.json');
            const keys = [...new Set([...Object.keys(a), ...Object.keys(b)])].sort();
            const rows = keys.map((k) => {
              const x = a[k] ?? 0, y = b[k] ?? 0;
              const d = y - x;
              return '| ' + k + ' | ' + x + ' | ' + y + ' | ' + (d === 0 ? '—' : (d > 0 ? '+' + d : d)) + ' |';
            });
            console.log(['| bucket | before | after | Δ |', '|---|---|---|---|', ...rows].join('\n'));
          ")
          echo "table<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY

      # `gh label create` is idempotent with `|| true`; these labels don't exist by default and
      # create-pull-request cannot create them itself.
      - name: Ensure labels exist
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create bindgen-preview --color ededed --description "Bindings regenerated with an unreleased bindgen build" 2>/dev/null || true
          gh label create do-not-merge --color b60205 --description "Experiment or preview — not for merging" 2>/dev/null || true

      - name: Slugify the bindgen spec for the branch name
        id: slug
        if: steps.diff.outputs.changed == 'true'
        run: |
          SLUG=$(printf '%s' "${{ inputs.bindgen_version }}" \
            | sed -E 's#https?://##; s#[^a-zA-Z0-9._-]+#-#g; s#^-+|-+$##g' \
            | cut -c1-60)
          SLUG="${SLUG:-candidate}"
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          # Emit the FULL branch name once: both the PR step and the publish step need it, and
          # two copies of the same expression are two chances for them to drift apart — which
          # would silently publish from a branch that does not exist.
          echo "branch=bindgen-try/$SLUG-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Open draft PR with the regenerated bindings
        id: pr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          branch: ${{ steps.slug.outputs.branch }}
          title: '[DO NOT MERGE] bindgen trial: ${{ inputs.bindgen_version }}'
          commit-message: |
            chore(trial): regenerate bindings with ${{ inputs.bindgen_version }}

            Not a bindgen bump — package.json and the lockfile are untouched.
            Opened by the try-bindgen workflow (run ${{ github.run_number }}).
          body: |
            > ⚠️ **DO NOT MERGE.** A throwaway experiment showing what a candidate
            > `@juspay/rescript-bindgen` build produces. `package.json` and
            > `package-lock.json` are deliberately **unchanged** — this branch only
            > carries regenerated `src/`. A real upgrade is a separate, deliberate
            > `package.json` bump PR.

            ### Candidate

            | | |
            |---|---|
            | requested | `${{ inputs.bindgen_version }}` |
            | version string | `${{ steps.fingerprint.outputs.version }}` |
            | resolved from | `${{ steps.fingerprint.outputs.resolved }}` |
            | `extract.mjs` sha256 | `${{ steps.fingerprint.outputs.sha }}…` |

            The version string is **not** proof of what ran — a pkg.pr.new build keeps the
            version of the release it branched from. The resolved URL and the hash are.

            ### Baseline

            | | before | after |
            |---|---|---|
            | bindgen | `${{ steps.baseline.outputs.bindgen }}` | `${{ steps.fingerprint.outputs.version }}` |
            | blend | `${{ steps.baseline.outputs.blend }}` | `${{ steps.fingerprint.outputs.blend }}` |

            ### Result

            | step | outcome |
            |---|---|
            | `npm run generate` | ${{ steps.generate.outcome == 'success' && '✅ ok' || '❌ failed — see the run log' }} |
            | `npm run build` | ${{ steps.build.outcome == 'success' && '✅ compiles' || '❌ failed — see the run log' }} |

            ### Report buckets

            ${{ steps.buckets.outputs.table }}

            ### Reviewing this

            - The `src/` diff is the whole deliverable — read it as a mapping change.
            - A bucket moving into `review`/`broken` is a regression in the candidate.
            - `generate` failing while a diff still exists is expected: `scripts/generate.mjs`
              writes `src/` before its `broken > 0` gate exits non-zero.

            _Triggered by @${{ github.actor }} · run ${{ github.run_number }}._
          labels: |
            automated
            bindgen-preview
            do-not-merge
          add-paths: |
            src/**

      # Publishes the PR's branch, so a consumer can install the exact regenerated output
      # (`npm i https://pkg.pr.new/@juspay/rescript-blend@<sha>`).
      #
      # The explicit fetch + checkout is LOAD-BEARING, not tidiness. `create-pull-request`
      # commits the regenerated files to its own branch and pushes, then restores the local
      # repository to its pre-action state — so by the time this step runs, the working tree
      # is back to the BASE bindings. Publishing from it would hand out a preview containing
      # the OLD output while the PR right next to it shows the new one: a silent mismatch, and
      # exactly the class of "looks convincing, is wrong" failure the fingerprint step exists
      # to prevent. Checking the branch out first also pins the pkg.pr.new URL to a commit that
      # actually CONTAINS the content, rather than to the dispatched ref's SHA.
      #
      # node_modules is gitignored, so it survives the checkout — no reinstall needed.
      #
      # Gated on a green build for the same reason preview.yml is: never hand out a preview
      # that doesn't compile.
      - name: Publish preview to pkg.pr.new
        if: inputs.publish_preview && steps.diff.outputs.changed == 'true' && steps.build.outcome == 'success'
        env:
          BRANCH: ${{ steps.slug.outputs.branch }}
        run: |
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          echo "Publishing from $BRANCH @ $(git rev-parse --short HEAD)"
          npx pkg-pr-new publish

      # Report the candidate's real status LAST, so the PR is opened either way. A candidate that
      # fails to generate or compile must leave a red run, not a green one with a quiet note.
      - name: Reflect candidate status
        if: steps.generate.outcome != 'success' || steps.build.outcome != 'success'
        run: |
          echo "::error::Candidate bindgen failed: generate=${{ steps.generate.outcome }}, build=${{ steps.build.outcome }}"
          exit 1
